<!DOCTYPE html>
<html>
    
    <head>
        <style>
            body { width: 220px; padding: 15px; background: #1e1e1e; color: white; text-align: center; font-family: Arial, Helvetica, sans-serif; }
            #optionsBtn { background: none; color: #7aa2f7; border: 2px solid rgb(0, 0, 0); padding: 5px; cursor: pointer; border-radius: 50%; font-size: large; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; }
            #startBtn { background: #000000; color: white; border: 1px solid white; padding: 10px; cursor: pointer; border-radius: 20px; width: 100%; margin-top: 10px; }
            #resetBtn { background: none; color: #7aa2f7; border: 1px solid #7aa2f7; padding: 8px; cursor: pointer; border-radius: 20px; width: 100%; margin-top: 8px; display: none; }
            .timer-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
            #timerDisplay { font-size: 2.5rem; color: #048451; font-family: monospace; margin: 0; }
            .adjust-btn {
                background: #000000;
                color: white;
                border: 1px solid white;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                cursor: pointer;
                font-size: 18px;
                line-height: 1;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                user-select: none;
                transition: background 0.2s, border-color 0.2s, opacity 0.2s;
            }
            .adjust-btn:hover { background: #333333; border-color: #7aa2f7; color: #7aa2f7; }
            .adjust-btn:active { transform: scale(0.95); }
            .adjust-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: #666; color: #888; }
            .adjust-btn.hidden { display: none; }
            .header { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
            h3 { margin: 0; }
        </style>
    </head>

    <body>
        <div class="header">
            <h3>Focus Pomodoro</h3>
            <button id="optionsBtn">&#9881;</button>
        </div>
        <div class="timer-container">
            <button id="minusBtn" class="adjust-btn" title="Decrease 5 minutes">-</button>
            <h2 id="timerDisplay">25:00</h2>
            <button id="plusBtn" class="adjust-btn" title="Increase 5 minutes">+</button>
        </div>
        <button id="startBtn">Start Session</button>
        <button id="resetBtn">Reset</button>

        <script src="popup.js"></script>
    </body>

</html>
